    merchant_create_uploads:
      title: merchant_create_uploads
      required:
        - file
        - parent_id
        - parent_type
      type: object
      properties:
        file:
          type: string
          format: binary
          description: (Required) (The image or video file to upload, sent as the file field of a multipart/form-data request)
        parent_id:
          type: string
          description: (Required) (This needs to be reviews or qnas _id value)
        parent_type:
          type: string
          description: (Required) (This can only be one of reviews,qnas)
        position:
          type: number
          description: (Minimum is 1) (Defaults to 1) (This needs to be the position of the upload among the uploads of the same review or qna)
      example:
        file: <binary> (Required) (The image or video file)
        parent_id: <string> (Required) (This needs to be reviews or qnas _id value)
        parent_type: <string> (Required) (This can only be one of reviews,qnas)
