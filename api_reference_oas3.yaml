    merchant_create_checkoutcheckboxactions:
      title: merchant_create_checkoutcheckboxactions
      required:
        - action
        - amount
      type: object
      properties:
        lead_id:
          type: string
          description: (One of lead_id, customer_id is required, unless x-leadtoken header is passed) (This needs to be leads _id value)
        customer_id:
          type: string
          description: (One of lead_id, customer_id is required, unless x-leadtoken header is passed) (Minimum length is 8) (Maximum length is 128) (This needs to be leads customer_id value)
        action:
          type: string
          description: (Required) (This can only be one of list,perform,revert) (list returns the discount the customer can get for this cart, perform generates the discount coupon, revert cancels the coupon generated earlier)
        amount:
          type: number
          description: (Required) (Minimum is 1) (This needs to be the cart total amount in your store currency, before the loyalty discount)
      example:
        lead_id: <uuid> (One of lead_id, customer_id is required, unless x-leadtoken header is passed) (This needs to be leads _id value)
        customer_id: <string> (One of lead_id, customer_id is required, unless x-leadtoken header is passed) (Minimum length is 8) (Maximum length is 128) (This needs to be leads customer_id value)
        action: <string> (Required) (This can only be one of list,perform,revert)
        amount: 1500

    merchant_create_checkoutpageactions:
      title: merchant_create_checkoutpageactions
      required:
        - action
        - amount
      type: object
      properties:
        lead_id:
          type: string
          description: (One of lead_id, customer_id is required, unless x-leadtoken header is passed) (This needs to be leads _id value)
        customer_id:
          type: string
          description: (One of lead_id, customer_id is required, unless x-leadtoken header is passed) (Minimum length is 8) (Maximum length is 128) (This needs to be leads customer_id value)
        action:
          type: string
          description: (Required) (This can only be one of list,perform,revert) (list returns the maximum discount and the step size the customer can redeem for this cart, perform generates the discount coupon for the chosen step, revert cancels the coupon generated earlier)
        amount:
          type: number
          description: (Required) (Minimum is 1) (This needs to be the cart total amount in your store currency, before the loyalty discount)
        step:
          type: number
          description: (Required when action is perform) (Minimum is 1) (Number of steps the customer chose to redeem, must be less than or equal to delta_step returned by the list action) (Coins deducted = delta_mincoinperstep x step, discount = delta_minfiatperstep x step)
        line_items:
          type: array
          description: (Optional) (Pass the cart line items when the checkout page offer is restricted to specific products or collections, so that the discount is calculated only on the applicable items) (When omitted the full cart amount is considered applicable)
          items:
            type: object
            required:
              - reference_product_id
              - reference_product_source
              - quantity
              - price
              - discount_amount
              - total_amount
            properties:
              reference_product_id:
                type: string
                description: (Required) (This needs to be the product id on your platform, ex. shopify product id)
              reference_product_source:
                type: string
                description: (Required) (This can only be one of custom_website,shopify,woocommerce)
              quantity:
                type: number
                description: (Required) (Minimum is 0)
              price:
                type: number
                description: (Required) (Minimum is 0) (Unit price of the product)
              discount_amount:
                type: number
                description: (Required) (Minimum is 0) (Discount already applied on this line)
              total_amount:
                type: number
                description: (Required) (Minimum is 0) (Line total after discount, this is the amount used for the applicable cart calculation)
      example:
        lead_id: <uuid> (One of lead_id, customer_id is required, unless x-leadtoken header is passed) (This needs to be leads _id value)
        customer_id: <string> (One of lead_id, customer_id is required, unless x-leadtoken header is passed) (Minimum length is 8) (Maximum length is 128) (This needs to be leads customer_id value)
        action: <string> (Required) (This can only be one of list,perform,revert)
        amount: 1500
        step: 3
        line_items:
          - reference_product_id: <string> (Required) (This needs to be the product id on your platform)
            reference_product_source: <string> (Required) (This can only be one of custom_website,shopify,woocommerce)
            quantity: 1
            price: 1500
            discount_amount: 0
            total_amount: 1500

