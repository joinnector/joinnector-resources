tags:
  - name: Trigger APIs (Easiest way to start rewarding with nector)
    description: Reward a customer by firing a trigger configured on the dashboard. The trigger decides what is rewarded (coins, offer, email, event or webhook) and how often, so your code only needs the trigger id.
  - name: User APIs
    description: Create and fetch customers (leads). A lead holds the wallet balance, tier, membership and referral code of the customer.
  - name: Wallet Reward APIs
    description: Credit or debit coins in the primary wallet of a customer directly and fetch the wallet transactions.
  - name: Credit Wallet Reward APIs
    description: Credit or debit the secondary credit wallet (store credit, gift cards, returns) where 1 credit = 1 unit of your currency. Available on select plans only.
  - name: Offer Reward or Redeem APIs
    description: Give an offer to a customer for free (reward) or let them spend coins on it (redeem), and fetch the resulting coupons. Offer ids come from businessoffers of Fetch Aggreegated Offers.
  - name: Cross Selling Offer Reward or Redeem APIs
    description: Same as Offer Reward or Redeem APIs but for partner brand offers (open loop loyalty). Public offer ids come from brandoffers of Fetch Aggreegated Offers.
  - name: Checkout Redemption APIs
    description: Let the customer redeem coins directly on your checkout as a discount code. Backed by the Checkout Checkbox and Checkout Page actions configured on the dashboard, each action uses its own offer (classification action_checkoutcheckbox or action_checkoutpage) to decide the coin to discount ratio. Currently the generated discount code is created on Shopify, so the offer rule type must be shopify.
  - name: Review APIs
    description: Create and fetch product reviews collected on behalf of your customers.
  - name: QnA APIs
    description: Create and fetch product questions collected on behalf of your customers.
  - name: Referral APIs
    description: Claim a referral code, invite friends and fetch the referrals of a customer.
  - name: Upload Image or Video APIs
    description: Attach an image or video to a review or qna.
  - name: Earning, Redemption & Settings Listing APIs
    description: Read only APIs that return the loyalty program configuration in one call each, the earning rules (triggers), the redemption rules (offers) and the program settings. Use these to render the program on your app or website.

paths:
  /activities:
    post:
      operationId: merchantv2_create_activities
      tags:
        - Trigger APIs (Easiest way to start rewarding with nector)
      summary: Reward Using Trigger
      description: This API is used to reward users based on the trigger. The trigger can be any of the following wallet reward, offer reward, email, event, or webhook. The trigger can be set up in the Nector dashboard and its _id can be fetched using Fetch Triggers. The earning rule of the trigger (once, once in a period, on activity count reached and so on) is evaluated on our side, so it is safe to call this API on every occurrence of the action. This API can be called only with full access api key, make sure to call this API only from your backend using full access api key. DO NOT EXPOSE FULL ACCESS API KEY
      parameters:
        - name: x-source
          in: header
          description: (Required) (This can only be one of mobile,unix,web)
          required: true
          schema:
            type: string
        - name: x-apikey
          in: header
          description: (Required) (This needs to be your apikey)
          required: true
          schema:
            type: string
        - name: x-workspaceid
          in: header
          description: (Required) (This needs to be your workspaceid)
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/merchant_create_activities"
        required: true

      responses:
        "200":
          description: "200"
        "4XX":
          description: Client error. The HTTP status code is one of 400 (validation failed), 401 (api key, workspace id or lead token not valid), 403 (not allowed), 404 (not found), 422 (business rule failed, read data.message), 428 (another request for the same customer is in progress, retry after a moment), 429 (rate limit exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "5XX":
          description: Unexpected error on our side. Retry with backoff and share meta.request_id with support@nector.io if it persists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
      security: []

