    merchant_create_leads:
      title: merchant_create_leads
      required:
        - customer_id
        - name
        - metadetail
      type: object
      properties:
        customer_id:
          type: string
          description: (Required) (Make sure this is not predictable value. ex any uuid value) (Minimum length is 8) (Maximum length is 128) (This is the mapping id between your system and nector, this value can be used to pull the details of the customer)
        name:
          type: string
          description: (Required) (This is full name of the user ex. John Wick) (Maximum length is 200)
        metadetail:
          type: object
          description: (Required) (One of email or mobile must be passed inside metadetail)
          properties:
            email:
              type: string
              description: (One of mobile or email is required) (This needs to be valid email)
            mobile:
              type: string
              description: (Minimum length is 4) (Maximum length is 15) (One of mobile or email is required)
            country:
              type: string
              description: (This needs to be one of the allowed countries, required when mobile is passed) (Should be 3 character long and lowercase ex. usa)
            dob:
              type: string
              description: (This needs to be ISO format date only)
      example:
        customer_id: <string> (Required) (Make sure this is not predictable value. ex any uuid value) (Minimum length is 8) (Maximum length is 128) (This is the mapping id between your system and nector, this value can be used to pull the details of the customer)
        name: <string> (Required) (This is full name of the user ex. John Wick) (Maximum length is 200)
        metadetail:
          email: <string> (One of mobile or email is required) (This needs to be valid email)
          mobile: <string> (Minimum length is 4) (Maximum length is 15) (One of mobile or email is required)
          country: <string> (This needs to be one of the allowed countries, required when mobile is passed) (Should be 3 character long and lowercase ex. usa)
          dob: <string> (This needs to be ISO format date only)

    merchant_update_leads:
      title: merchant_update_leads
      type: object
      properties:
        metadetail:
          properties:
            dob:
              type: string
              description: (This needs to be ISO format date only)
      example:
        metadetail:
          dob: <string> (This needs to be ISO format date only)

    merchant_create_wallettransactions:
      title: merchant_create_wallettransactions
      required:
        - title
        - amount
        - operation
      type: object
      properties:
        lead_id:
          type: string
          description: (One of lead_id, customer_id is required) (This needs to be leads _id value)
        customer_id:
          type: string
          description: (One of lead_id, customer_id is required) (Minimum length is 8) (Maximum length is 128) (This needs to be leads customer_id value)
        title:
          type: string
          description: (Required) (This needs to be wallettransaction title)
        description:
          type: string
          description: (This needs to be wallettransaction description)
        amount:
          type: number
          description: (Required) (Minimum is 1) (This needs to be the coin amount)
        hash:
          type: string
          description: (Maximum length is 64) (This can be any hash value that you want to pass for mapping between your system and nector, ex. your order id, and can later be used to filter transactions)
        operation:
          type: string
          description: (Required) (This needs to be wallettransaction operation value) (This can only be one of cr,dr) (cr credits coins to the wallet, dr debits coins from the wallet)
      example:
        lead_id: <uuid> (One of lead_id, customer_id is required) (This needs to be leads _id value)
        customer_id: <string> (One of lead_id, customer_id is required) (Minimum length is 8) (Maximum length is 128) (This needs to be leads customer_id value)
        title: <string> (Required) (This needs to be wallettransaction title)
        description: <string> (This needs to be wallettransaction description)
        amount: 12
        hash: <string> (Maximum length is 64) (This can be any hash value that you want to pass for mapping between your system and nector)
        operation: <string> (Required) (This needs to be wallettransaction operation value) (This can only be one of cr,dr) (cr credits coins to the wallet, dr debits coins from the wallet)

