  /actions-checkoutcheckbox:
    post:
      tags:
        - Checkout Redemption APIs
      operationId: merchantv2_create_checkoutcheckboxactions
      summary: Checkout Checkbox Redemption
      description: |-
        Single step redemption for the checkout checkbox flow, i.e. a "Use my coins" checkbox on the cart or checkout. The discount is always the maximum the customer can get for the cart, there is no step selection.

            - The offer used is the published or active offer with classification action_checkoutcheckbox. If the customer has a membership (or else a tier) and an offer restricted to that membership (or tier) exists, that offer is used instead of the universal one
            - The discount is capped by the offer fiat_range, the customer's coin balance, the cart amount and the minimum cart configured on the offer
            - Requires the Checkout Checkbox action to be active on the dashboard, otherwise the API fails
            - Calls for the same customer are serialised, so concurrent calls from multiple tabs are safe

        Actions

            - list: returns points_balance and a promotions entry describing the discount that can be applied (coin_value to deduct, fiat_value discount, delta_amount payable after discount). If a valid coupon was already generated for this cart amount, it returns that coupon in coupons instead
            - perform: generates the discount coupon and returns it in coupons. Use coupons[0].value as the discount code on the checkout (it starts with neccbox). The coins are deducted when the order is placed with the code, not at generation. The coupon expires in 24 hours if unused. Calling perform again with the same amount returns the existing coupon, calling it with a different amount cancels the old coupon and generates a new one
            - revert: cancels the coupon generated earlier (status becomes unavailable and the discount code is removed from the store). Call this when the customer unticks the checkbox or removes the code

        Errors are returned with a message such as "No discount is available" when the cart is below the minimum cart, the customer has no coins, or the offer is not configured.
      parameters:
        - name: x-source
          in: header
          description: (Required) (This can only be one of mobile,unix,web)
          required: true
          schema:
            type: string
        - name: x-apikey
          in: header
          description: (Required) (This needs to be your apikey)
          required: true
          schema:
            type: string
        - name: x-workspaceid
          in: header
          description: (Required) (This needs to be your workspaceid)
          required: true
          schema:
            type: string
        - name: x-leadtoken
          in: header
          description: (Required only when calling with a read only storefront api key) (This needs to be the lead_token returned by Get User, valid for 1 hour) (When passed, lead_id and customer_id in the body are ignored and the customer is taken from the token)
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/merchant_create_checkoutcheckboxactions"
        required: true

      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/success"
              example:
                meta: {}
                data:
                  item:
                    action: <string> (Echo of the action passed, one of list,perform,revert)
                    points_label: <string> (Label to show next to the balance, ex. Coins)
                    points_balance: <string> (Current coin balance of the customer)
                    offers:
                      - name: <string> (Present for list)
                        description: <string>
                    promotions:
                      - type: <string> (Present for list) (One of flat_discount,percent_discount)
                        title: <string> (Ready to display title, ex. Get $150 off)
                        description: <string> (Ready to display description, ex. Redeem 1500 coins)
                        coin_value: <number> (Coins that will be deducted)
                        fiat_value: <number> (Discount value, an amount for flat_discount or a percent for percent_discount)
                        delta_redeemable: <number> (Discount amount in currency)
                        delta_amount: <number> (Cart amount payable after the discount)
                        delta_mincoinperstep: <number> (Coins per step as configured on the offer)
                        delta_minfiatperstep: <number> (Discount per step as configured on the offer)
                        delta_step: <number> (Number of steps applied)
                    coupons:
                      - _id: <uuid> (Present for perform, or for list when a coupon already exists)
                        value: <string> (Discount code to apply on the checkout, starts with neccbox)
                        fiat_class: <string> (One of amount,percent)
                        fiat_value: <number>
                        status: <string> (issued)
                        redirect_link: <string> (Checkout link with the discount code applied, when configured)
                        expire: <string> (ISO date, 24 hours after generation)
        "4XX":
          description: Client error. The HTTP status code is one of 400 (validation failed), 401 (api key, workspace id or lead token not valid), 403 (not allowed), 404 (not found), 422 (business rule failed, read data.message), 428 (another request for the same customer is in progress, retry after a moment), 429 (rate limit exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "5XX":
          description: Unexpected error on our side. Retry with backoff and share meta.request_id with support@nector.io if it persists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
      security: []

  /actions-checkoutpage:
    post:
      tags:
        - Checkout Redemption APIs
      operationId: merchantv2_create_checkoutpageactions
      summary: Checkout Page Redemption
      description: |-
        Multi step redemption for the checkout page flow, i.e. a slider or stepper on the checkout where the customer chooses how many coins to redeem.

            - The offer used is the published or active offer with classification action_checkoutpage. If the customer has a membership (or else a tier) and an offer restricted to that membership (or tier) exists, that offer is used instead of the universal one
            - Each step deducts delta_mincoinperstep coins and gives delta_minfiatperstep discount. delta_step returned by list is the maximum number of steps allowed for this cart, capped by the offer fiat_range, the customer's coin balance, the cart amount and the minimum cart configured on the offer
            - Pass line_items when the offer is restricted to specific products or collections, the applicable cart amount is then the sum of total_amount of the matching lines (capped by amount). When line_items is omitted the full amount is considered applicable
            - Requires the Checkout Page action to be active on the dashboard, otherwise the API fails
            - Calls for the same customer are serialised, so concurrent calls from multiple tabs are safe

        Actions

            - list: returns points_balance and a promotions entry with the maximum discount (coin_value, fiat_value, delta_amount) and the step configuration (delta_mincoinperstep, delta_minfiatperstep, delta_step). Render the slider from 1 to delta_step. If a valid coupon was already generated and still fits the cart, it returns that coupon in coupons instead
            - perform: requires step. Generates the discount coupon for the chosen step and returns it in coupons. Use coupons[0].value as the discount code on the checkout (it starts with necpage). step greater than delta_step fails with "Steps cannot be greater than allowed steps". The coins are deducted when the order is placed with the code, not at generation. The coupon expires in 24 hours if unused. Calling perform again when an existing coupon still fits the cart returns it, otherwise the old coupon is cancelled and a new one is generated
            - revert: cancels the coupon generated earlier (status becomes unavailable and the discount code is removed from the store). Call this when the customer resets the slider or removes the code

        Errors are returned with a message such as "No discount is available" when the cart is below the minimum cart, the customer has no coins, or the offer is not configured.
      parameters:
        - name: x-source
          in: header
          description: (Required) (This can only be one of mobile,unix,web)
          required: true
          schema:
            type: string
        - name: x-apikey
          in: header
          description: (Required) (This needs to be your apikey)
          required: true
          schema:
            type: string
        - name: x-workspaceid
          in: header
          description: (Required) (This needs to be your workspaceid)
          required: true
          schema:
            type: string
        - name: x-leadtoken
          in: header
          description: (Required only when calling with a read only storefront api key) (This needs to be the lead_token returned by Get User, valid for 1 hour) (When passed, lead_id and customer_id in the body are ignored and the customer is taken from the token)
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/merchant_create_checkoutpageactions"
        required: true

      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/success"
              example:
                meta: {}
                data:
                  item:
                    action: <string> (Echo of the action passed, one of list,perform,revert)
                    points_label: <string> (Label to show next to the balance, ex. Coins)
                    points_balance: <string> (Current coin balance of the customer)
                    offers:
                      - name: <string> (Present for list)
                        description: <string>
                    promotions:
                      - type: <string> (Present for list) (One of flat_discount,percent_discount)
                        title: <string> (Ready to display title for the maximum discount)
                        description: <string> (Ready to display description)
                        coin_value: <number> (Coins deducted at the maximum step)
                        fiat_value: <number> (Discount at the maximum step, an amount for flat_discount or a percent for percent_discount)
                        delta_redeemable: <number> (Discount amount in currency at the maximum step)
                        delta_amount: <number> (Cart amount payable after the maximum discount)
                        delta_mincoinperstep: <number> (Coins per step, slider increment in coins)
                        delta_minfiatperstep: <number> (Discount per step, slider increment in currency or percent)
                        delta_step: <number> (Maximum number of steps allowed for this cart)
                    coupons:
                      - _id: <uuid> (Present for perform, or for list when a coupon already exists)
                        value: <string> (Discount code to apply on the checkout, starts with necpage)
                        fiat_class: <string> (One of amount,percent)
                        fiat_value: <number>
                        status: <string> (issued)
                        redirect_link: <string> (Checkout link with the discount code applied, when configured)
                        expire: <string> (ISO date, 24 hours after generation)
        "4XX":
          description: Client error. The HTTP status code is one of 400 (validation failed), 401 (api key, workspace id or lead token not valid), 403 (not allowed), 404 (not found), 422 (business rule failed, read data.message), 428 (another request for the same customer is in progress, retry after a moment), 429 (rate limit exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "5XX":
          description: Unexpected error on our side. Retry with backoff and share meta.request_id with support@nector.io if it persists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
      security: []

  /triggers:
    get:
      tags:
        - Earning, Redemption & Settings Listing APIs
      operationId: merchantv2_list_triggers
      summary: Fetch Triggers (Aggregated Earning Rules)
      description: |-
        Fetches the aggregated earning rules of your loyalty program, i.e. the triggers through which a customer can earn (signup, purchase, review, referral, birthday, social follows and so on).

            - Only triggers that are active and visible are returned, ordered by their position as configured on the dashboard
            - Pass content_types to fetch only earn or only social triggers
            - Pass lead_id to also get activities, the number of times that customer has already completed each trigger (useful to show completed / pending state in the UI)
            - Triggers of reward_type offer carry the linked offer object so the reward coupon can be rendered without an extra call
            - Use this API along with Fetch Aggreegated Details (program settings) and Fetch Aggreegated Offers (redemption rules) to render the complete loyalty program on your app or website
            - Prefer cachefront.nector.io for this call

        Response data contains

            - items: array of triggers (_id, slug, name, content_type, reward_type, rule_type, render_type, reward, rule, content, position, is_open, is_override, offer)
            - count: total number of matching triggers
            - activities: array of { trigger_id, count } for the given lead_id (empty array when lead_id is not passed)
      parameters:
        - name: id
          in: query
          description: (This needs to be triggers _id value) (Fetch a single trigger)
          schema:
            type: string
        - name: lead_id
          in: query
          description: (This needs to be leads _id value) (When passed, activities array in the response contains the completion count of each trigger for this customer)
          schema:
            type: string
        - name: content_types
          in: query
