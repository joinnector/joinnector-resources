      example:
        lead_id: <uuid> (One of lead_id, customer_id is required) (This needs to be leads _id value)
        customer_id: <string> (One of lead_id, customer_id is required) (Minimum length is 8) (Maximum length is 128) (This needs to be leads customer_id value)
        title: <string> (Required) (This needs to be creditwallettransaction title)
        description: <string> (This needs to be creditwallettransaction description)
        amount: 12
        hash: <string> (Maximum length is 64) (This can be any hash value that you want to pass for mapping between your system and nector)
        operation: <string> (Required) (This needs to be creditwallettransaction operation value) (This can only be one of cr,dr) (cr credits the credit wallet, dr debits the credit wallet)

    merchant_create_reviews:
      title: merchant_create_reviews
      required:
        - reference_product_source
        - reference_product_id
        - name
        - rating
        - description
      type: object
      properties:
        metadetail:
          properties:
            email:
              type: string
              description: (One of mobile or email is required) (This needs to be valid email)
            mobile:
              type: string
              description: (Minimum length is 4) (Maximum length is 15) (One of mobile or email is required)
            country:
              type: string
              description: (This needs to be one of the allowed countries, required when mobile is passed) (Should be 3 character long and lowercase ex. usa)
        order_id:
          type: string
          description: (This needs to be orders _id value) (If this is passed then the review will be attached against an order and the review will be marked as verified)
        reference_order_id:
          type: string
          description: (Minimum length is 1) (Maximum length is 128) (This needs to be the order id on your platform, ex. shopify order id) (Alternative to order_id, if this is passed then the review will be attached against the matching order and the review will be marked as verified)
        reference_product_source:
          type: string
          description: (Required) (This needs to be products reference_product_source value) (This can only be one of custom_website,shopify,woocommerce)
        reference_product_id:
          type: string
          description: (Required) (This needs to be products reference_product_id value)
        name:
          type: string
          description: (Required) (Maximum length is 200) (This needs to be the name of the user who is writing the review)
        rating:
          type: number
          description: (Required) (Minimum is 1) (Maximum is 5) (This needs to be rating of the review)
        description:
          type: string
          description: (Required) (This needs to be description of the review)
      example:
        metadetail:
          email: <string> (One of mobile or email is required) (This needs to be valid email)
          mobile: <string> (Minimum length is 4) (Maximum length is 15) (One of mobile or email is required)
          country: <string> (This needs to be one of the allowed countries, required when mobile is passed) (Should be 3 character long and lowercase ex. usa)
        order_id: <uuid> (This needs to be orders _id value) (If this is passed then the review will be attached against an order and the review will be marked as verified)
        reference_order_id: <string> (Minimum length is 1) (Maximum length is 128) (This needs to be the order id on your platform, ex. shopify order id) (Alternative to order_id)
        reference_product_source: <string> (Required) (This needs to be products reference_product_source value) (This can only be one of custom_website,shopify,woocommerce)
        reference_product_id: <string> (Required) (This needs to be products reference_product_id value)
        name: <string> (Required) (Maximum length is 200) (This needs to be the name of the user who is writing the review)
        rating: 4
        description: <string> (Required) (This needs to be description of the review)

