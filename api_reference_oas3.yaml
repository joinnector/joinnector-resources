  /aggreegateddetails:
    get:
      tags:
        - Earning, Redemption & Settings Listing APIs
      operationId: merchantv2_get_aggreegateddetails
      summary: Fetch Aggreegated Details (Program Settings)
      description: |-
        Fetches the complete configuration of your loyalty program in a single call. Call this once when your app or website loads and cache the result on the client.

            - Pass tier and/or membership of the logged in customer (from the leads object) to get the rules applicable to that tier / membership. Pass nothing (or null) for guest users to get the base rules
            - An unknown tier or membership is silently ignored and the base rules are returned
            - Response is cached on our side for up to 10 minutes, so changes made on the dashboard can take up to 10 minutes to reflect
            - Use this API along with Fetch Triggers (earning rules) and Fetch Aggreegated Offers (redemption rules) to render the complete loyalty program
            - Prefer cachefront.nector.io for this call

        Response data contains

            - businessinfos: your business entity (_id, workspace_id, integration_identifier, name, business_uri, program_name, coin_name, category, country, currency_code, language, quickdeploy_meta, is_freezed, is_running)
            - websdkinfos: storefront widget and page configs (appconfigs) used by the nector web sdk
            - planfeatureinfos: plan limits and the features enabled on your plan
            - featuresettinginfos: same as planfeatureinfos (kept for backward compatibility)
            - actioninfos: action rules of the program keyed by action, ex. loyalty_action (coin earning and spending ratio), tier_action, membership_action, referral_action, review_action, birthday_action, anniversary_action, gender_action, visitor_action, coinexpiry_action, creditexpiry_action, checkoutcheckbox_action, checkoutpage_action, orderrewardrevert_action, orderspentrevert_action, orderspentcreditrevert_action
            - integrationinfos: per integration reward rules (identifier, classification, rule_type, rule, status, tier, membership)
            - tooltrackinfos: third party tools detected on your storefront (counts of *_track stats for the current day)
            - miscinfos: currencyexchangerate of your business currency against usd
      parameters:
        - name: tier
          in: query
          description: (This needs to be leads tier value or null) (Pass the tier of the logged in customer to get tier specific rules) (Ignored if the tier does not exist)
          schema:
            type: string
            nullable: true
        - name: membership
          in: query
          description: (This needs to be leads membership value or null) (Pass the membership of the logged in customer to get membership specific rules) (Ignored if the membership does not exist)
          schema:
            type: string
            nullable: true
        - name: x-source
          in: header
          description: (Required) (This can only be one of mobile,unix,web)
          required: true
          schema:
            type: string
        - name: x-apikey
          in: header
          description: (Required) (This needs to be your apikey) (Read only api key is sufficient)
          required: true
          schema:
            type: string
        - name: x-workspaceid
          in: header
          description: (Required) (This needs to be your workspaceid)
          required: true
          schema:
            type: string

      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/success"
              example:
                meta: {}
                data:
                  businessinfos:
                    entity:
                      _id: <uuid>
                      workspace_id: <string>
                      name: <string>
                      program_name: <string>
                      coin_name: <string>
                      country: <string>
                      currency_code: <string>
                      language: <string>
                      is_running: <boolean>
                  websdkinfos: <object>
                  planfeatureinfos: <object>
                  featuresettinginfos: <object>
                  actioninfos:
                    loyalty_action: <object>
                    tier_action: <object>
                    membership_action: <object>
                    referral_action: <object>
                    review_action: <object>
                    birthday_action: <object>
                    coinexpiry_action: <object>
                  integrationinfos: <object>
                  tooltrackinfos: <object>
                  miscinfos:
                    currencyexchangerate: <object>
        "4XX":
          description: Client error. The HTTP status code is one of 400 (validation failed), 401 (api key, workspace id or lead token not valid), 403 (not allowed), 404 (not found), 422 (business rule failed, read data.message), 428 (another request for the same customer is in progress, retry after a moment), 429 (rate limit exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "5XX":
          description: Unexpected error on our side. Retry with backoff and share meta.request_id with support@nector.io if it persists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
      security: []

  /aggreegatedoffers:
    get:
      tags:
        - Earning, Redemption & Settings Listing APIs
      operationId: merchantv2_get_aggreegatedoffers
      summary: Fetch Aggreegated Offers (Aggregated Redemption Rules)
      description: |-
        Fetches the aggregated redemption rules of your loyalty program, i.e. the offers against which a customer can redeem their coins (ex. every 100 coins = 10 off, free shipping, free product).

            - Only offers in published or listed status are returned
            - published: the offer is active and visible, the customer can avail (redeem) it via Offer Reward or Redeem APIs
            - listed: the offer is visible for display only, it cannot be availed. Use it to show upcoming or locked rewards
            - Offers in active status are redeemable but hidden, offers in draft status are inactive. Neither is returned by this API
            - Pass tier and/or membership of the logged in customer (from the leads object) to get the universal offers (no tier / membership restriction) plus the offers restricted to that tier / membership. Pass nothing (or null) for guest users to get only the universal offers
            - An unknown tier or membership is silently ignored
            - classification defaults to loyalty. Pass an integration classification (ex. integration_shopifypos) to fetch the offers configured for that integration
            - Up to 50 offers are returned, ordered by created_at ascending
            - Response is cached on our side for up to 10 minutes, so changes made on the dashboard can take up to 10 minutes to reflect
            - Use this API along with Fetch Aggreegated Details (program settings) and Fetch Triggers (earning rules) to render the complete loyalty program
            - Prefer cachefront.nector.io for this call

        Response data contains

            - businessoffers: your own offers, { items: array of offers (_id, name, description, classification, tier, membership, rule_type, rule, expire_after_day, redirect_link, status, availed, used, view, meta), count }
            - brandoffers: cross selling offers from partner brands (publicoffers), { items: array of publicoffers, count }

        How to use the offer ids

            - businessoffers items _id is the offer_id to pass to Reward Offer (POST /offerrewards) and Redeem Offer (POST /offerredeems)
            - brandoffers items _id is the publicoffer_id to pass to Reward Cross Selling Offer (POST /publicofferrewards) and Redeem Cross Selling Offer (POST /publicofferredeems)
            - For a closed loop loyalty program (customers redeem only against your own brand) read businessoffers only and skip brandoffers
            - brandoffers is relevant only for an open loop loyalty program where customers can also redeem coins against partner brand offers
      parameters:
        - name: tier
          in: query
          description: (This needs to be leads tier value or null) (Pass the tier of the logged in customer to also get the offers restricted to that tier) (Ignored if the tier does not exist)
          schema:
            type: string
            nullable: true
        - name: membership
          in: query
          description: (This needs to be leads membership value or null) (Pass the membership of the logged in customer to also get the offers restricted to that membership) (Ignored if the membership does not exist)
          schema:
            type: string
            nullable: true
        - name: classification
          in: query
          description: (This can only be one of loyalty,shopifyfunction_automaticdiscount,integration_shopifypos,integration_logicerp,integration_zwingpos,integration_queuebusterpos,integration_fyndpos,integration_wondersoftpos,integration_custompos,integration_gokwik,integration_razorpay,integration_pragma,integration_fastrr,integration_juspay,integration_shopflo,integration_flexype,integration_cashfree,integration_customcheckout,action_checkoutcheckbox,action_checkoutpage,other) (Defaults to loyalty)
          schema:
            type: string
            nullable: true
        - name: x-source
          in: header
          description: (Required) (This can only be one of mobile,unix,web)
          required: true
          schema:
            type: string
        - name: x-apikey
          in: header
          description: (Required) (This needs to be your apikey) (Read only api key is sufficient)
          required: true
          schema:
            type: string
        - name: x-workspaceid
          in: header
          description: (Required) (This needs to be your workspaceid)
          required: true
          schema:
            type: string

      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/success"
              example:
                meta: {}
                data:
                  businessoffers:
                    items:
                      - _id: <uuid> (Pass as offer_id to Reward Offer or Redeem Offer)
                        name: <string>
                        description: <string>
                        classification: <string> (Defaults to loyalty)
                        tier: <string> (null when the offer is not restricted to a tier)
                        membership: <string> (null when the offer is not restricted to a membership)
                        rule_type: <string>
                        rule: <object> (Redemption rule, ex. coin_amount, fiat class and range, minimum cart)
                        expire_after_day: <number>
                        redirect_link: <string>
                        status: <string> (One of published,listed) (Only published offers can be availed)
                        availed: <number>
                        used: <number>
                        view: <number>
                        meta: <object>
                    count: <number>
                  brandoffers:
                    items:
                      - _id: <uuid> (Pass as publicoffer_id to Reward Cross Selling Offer or Redeem Cross Selling Offer) (Only for open loop loyalty, skip for closed loop loyalty)
                    count: <number>
        "4XX":
          description: Client error. The HTTP status code is one of 400 (validation failed), 401 (api key, workspace id or lead token not valid), 403 (not allowed), 404 (not found), 422 (business rule failed, read data.message), 428 (another request for the same customer is in progress, retry after a moment), 429 (rate limit exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "5XX":
          description: Unexpected error on our side. Retry with backoff and share meta.request_id with support@nector.io if it persists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
      security: []

